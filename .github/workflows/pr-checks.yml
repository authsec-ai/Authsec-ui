name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, authsec-staging, authsec-dev]

jobs:
  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: eslint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

  merge-gate:
    name: Merge Gate
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    if: always()
    steps:
      - name: Type check must pass
        if: needs.typecheck.result != 'success'
        run: |
          echo "TypeScript type check failed — merge blocked"
          exit 1
      - name: Lint must pass
        if: needs.lint.result != 'success'
        run: |
          echo "ESLint failed — merge blocked"
          exit 1
      - name: All checks passed
        run: echo "All required checks passed"
